name: Copilot Format Fixer

on:
  workflow_run:
    workflows: ["Management Release Assistant"]
    types: [completed]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign PR to Copilot if copilot-fix-format label is present
        uses: actions/github-script@v9
        with:
          # Must use a PAT (not GITHUB_TOKEN) to trigger Copilot coding agent.
          # GITHUB_TOKEN is a bot token — assignments made by bots do not trigger Copilot.
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const headSha = context.payload.workflow_run.head_sha;

            // Find PRs associated with this commit sha
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: headSha
            });

            const targetPR = prs.find(pr => pr.labels.some(l => l.name === 'copilot-fix-format'));
            if (!targetPR) {
              core.info('No PR with copilot-fix-format label found for this workflow run');
              return;
            }

            const prNumber = targetPR.number;
            core.info(`Found PR #${prNumber} with copilot-fix-format label`);

            // Remove trigger label (GITHUB_TOKEN is fine here)
            const octokit = getOctokit(process.env.GITHUB_TOKEN);
            try {
              await octokit.rest.issues.removeLabel({
                ...context.repo,
                issue_number: prNumber,
                name: 'copilot-fix-format'
              });
              core.info(`Removed copilot-fix-format label from PR #${prNumber}`);
            } catch (e) {
              core.warning(`Could not remove trigger label: ${e.message}`);
            }

            // Assign to Copilot coding agent using PAT so GitHub recognizes it as a user action
            const result = await github.rest.issues.addAssignees({
              ...context.repo,
              issue_number: prNumber,
              assignees: ['copilot']
            });

            const assigned = result.data.assignees?.some(a => a.login === 'copilot');
            if (assigned) {
              core.info(`Successfully assigned PR #${prNumber} to Copilot coding agent`);
            } else {
              core.warning(`copilot was not added to assignees. Got: ${JSON.stringify(result.data.assignees?.map(a => a.login))}`);
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
