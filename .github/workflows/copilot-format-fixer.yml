name: Copilot Format Fixer

on:
  workflow_run:
    workflows: ["Management Release Assistant"]
    types: [completed]

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign PR to Copilot if copilot-fix-format label is present
        uses: actions/github-script@v9
        with:
          # Must use a PAT (not GITHUB_TOKEN) to trigger Copilot coding agent.
          # GITHUB_TOKEN is a bot token — assignments made by bots do not trigger Copilot.
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const headSha = context.payload.workflow_run.head_sha;

            // Find PRs associated with this commit sha
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: headSha
            });

            // Process ALL PRs with the label (same commit may appear in multiple PRs)
            const targetPRs = prs.filter(pr => pr.labels.some(l => l.name === 'copilot-fix-format'));
            if (targetPRs.length === 0) {
              core.info('No PR with copilot-fix-format label found for this workflow run');
              return;
            }

            for (const targetPR of targetPRs) {
              const prNumber = targetPR.number;
              core.info(`Found PR #${prNumber} with copilot-fix-format label`);

              // Remove trigger label (GITHUB_TOKEN is fine here)
              const octokit = getOctokit(process.env.GITHUB_TOKEN);
              try {
                await octokit.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: prNumber,
                  name: 'copilot-fix-format'
                });
                core.info(`Removed copilot-fix-format label from PR #${prNumber}`);
              } catch (e) {
                core.warning(`Could not remove trigger label from PR #${prNumber}: ${e.message}`);
              }

              // Trigger Copilot coding agent by posting a @copilot comment using PAT.
              // Comment-based trigger is proven to work (assignment via API silently fails with bot tokens).
              // Requires GH_AW_GITHUB_TOKEN to be a real user PAT — if only GITHUB_TOKEN is available,
              // this comment will appear as the bot and will NOT trigger Copilot.
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body: '@copilot Please run `pnpm format` in the affected package directory and push the formatted files to fix the Check-format CI failure.'
              });
              core.info(`Posted @copilot comment on PR #${prNumber} to trigger formatting fix`);
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
