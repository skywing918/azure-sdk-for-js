name: Check Format
on:
  pull_request:
    branches: ["*"]
jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run format check
        run: |
          pnpm run check-format || (echo "Check-format FAILED" && exit 1)
        working-directory: sdk/containerservice/arm-containerservicefleet
